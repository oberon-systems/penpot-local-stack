# The commit-msg hooks below only ever run once git has a commit-msg hook
# script, which `pre-commit install` writes only when asked for that type.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
        files: \.(py|sh|md|ya?ml)$
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        files: \.(py|sh|md|ya?ml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      # markdownlint-cli 0.49 needs Node 20 or newer, so it gets its own rather
      # than whatever the system happens to have.
      - id: markdownlint
        language_version: '22.11.0'
        exclude: CHANGELOG.md

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
      - id: require-ascii
        exclude: .*\.md$
      - id: shellcheck
        args: [-e, SC2086]
      # -i 4 overrides shfmt's tab indentation, which the forbid-tabs hook
      # above rejects in *.sh. Without it the two hooks fight over every edit.
      - id: shfmt
        args: [-w, -i, '4']

  # `cz check` validates the message against the provider's schema_pattern(),
  # so the hook environment needs the provider itself: pre-commit builds it in
  # isolation and .cz.yaml names wyld_cz.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        additional_dependencies: [wyld-cz==0.3.0]
      - id: commitizen-branch
        additional_dependencies: [wyld-cz==0.3.0]
        stages: [pre-push]
