# Weekly update pull requests for the Python requirements, the pre-commit hooks,
# the Compose images and the GitHub Actions; minor and patch come grouped.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][deps]"
    groups:
      pip:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][deps]"
    groups:
      pre-commit:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: "/config"
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][deps]"
    groups:
      docker-compose:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][deps]"
    groups:
      github-actions:
        update-types: [minor, patch]
